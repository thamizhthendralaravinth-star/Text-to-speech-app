name: Build Windows app
on:
  push:
    branches: [main]
    paths: ['app/**', 'electron/**', 'package.json', 'package-lock.json', 'scripts/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run get-voice
        shell: bash
      - run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Thendral-Windows
          path: dist/*.exe
      # every build becomes the "latest release", so the download link never changes
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: Thendral for Windows (build ${{ github.run_number }})
          body: Download **Thendral-Setup** to install, or **Thendral-Portable** to run without installing.
          make_latest: true
          files: dist/*.exe
