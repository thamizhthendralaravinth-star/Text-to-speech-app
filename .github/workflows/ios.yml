name: Build iPhone app
# macOS runners are sometimes busy; a push to ios/ or this file starts a fresh attempt.
on:
  push:
    branches: [main]
    paths: ['app/**', 'ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
concurrency:
  group: ios-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Add the web app and the voice model
        run: |
          cd ios
          rm -rf web && cp -R ../app web
          curl -SL -o kokoro.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-en-v0_19.tar.bz2
          tar xf kokoro.tar.bz2 && rm kokoro.tar.bz2
          rm -rf kokoro && mv kokoro-int8-en-v0_19 kokoro
          du -sh web kokoro
      - name: Generate the Xcode project
        run: cd ios && xcodegen generate
      - name: Check that it compiles (no Apple account needed)
        if: env.HAS_SIGNING != 'true'
        run: |
          cd ios
          set +e
          xcodebuild -project Thendral.xcodeproj -scheme Thendral -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          status=$?
          grep -E "error:|warning: .*Thendral/|\*\* BUILD" build.log | head -80
          exit $status
      - name: Build and send to TestFlight
        if: env.HAS_SIGNING == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -eo pipefail
          cd ios
          mkdir -p keys && printf '%s\n' "$ASC_KEY_P8" > keys/AuthKey.p8
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$PWD/keys/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project Thendral.xcodeproj -scheme Thendral -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Thendral.xcarchive archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION=${{ github.run_number }} "${AUTH[@]}" | xcbeautify
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Thendral.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export "${AUTH[@]}" | xcbeautify
          echo "Sent build ${{ github.run_number }} to TestFlight"
